aid: sliderule
name: SlideRule
description: 'SlideRule is a no-code risk decisioning platform that lets risk and operations
  teams build, test, and deploy automated decision logic for fraud, credit, compliance,
  and trust-and-safety use cases without writing code. Its rules engine combines SQL
  and API data connectors, real-time analytics, A/B testing, backtesting, shadow mode,
  and case-management automation, and exposes a single API to trigger decision workflows.
  SlideRule has announced it is joining Block, Inc.; its standalone developer documentation
  surface (docs.sliderule.io) is no longer publicly reachable, so no live API specification
  could be harvested during enrichment.'
